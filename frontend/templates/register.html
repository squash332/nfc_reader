<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>SENTINEL — Accounts</title>
    <link rel="stylesheet" href="/static/fonts.css">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/accounts.css">
    <script src="/static/topbar.js"></script>
</head>
<body>

    <div class="scanlines" aria-hidden="true"></div>

    <div class="app">

        <!-- ── TOP NAV ── -->
        <app-topbar></app-topbar>

        <!-- ── MAIN ── -->
        <div class="main">

            <!-- ── LEFT: CREATE ACCOUNT ── -->
            <aside class="register-panel">

                <div class="panel-heading">
                    <div class="panel-title">CREATE ACCOUNT</div>
                    <div class="panel-sub">Add login credentials</div>
                </div>

                <div class="form-group">
                    <label class="form-label">ROLE</label>
                    <div class="form-input custom-select" id="role-btn" tabindex="0">
                        <span class="custom-select-value">—</span>
                        <span class="custom-select-arrow">▾</span>
                    </div>
                    <input type="hidden" id="role">
                </div>

                <div class="form-group" id="user-link-group">
                    <label class="form-label" for="user-search">PROFILE</label>
                    <input type="text" id="user-search" class="form-input" placeholder="Search by name or email" autocomplete="off">
                    <input type="hidden" id="user-id">
                    <input type="hidden" id="user-email">
                </div>

                <div class="form-group" id="admin-email-group" style="display:none">
                    <label class="form-label" for="email">EMAIL</label>
                    <input type="email" id="email" class="form-input" placeholder="admin@email.com" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">PASSWORD</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••">
                </div>

                <button id="add-btn" class="add-btn">
                    <span class="add-btn-icon">＋</span>
                    CREATE ACCOUNT
                </button>

                <div id="message" class="message"></div>

            </aside>

            <!-- ── RIGHT: ACCOUNT LIST ── -->
            <main class="registry-panel">

                <div class="registry-header">
                    <div>
                        <div class="panel-title">ACCOUNTS</div>
                        <div class="panel-sub" id="account-count">Loading…</div>
                    </div>
                    <div id="filter-badge" class="filter-badge" style="display:none">
                        <span id="filter-label"></span>
                        <a href="/register" class="filter-clear">× ALL</a>
                    </div>
                </div>

                <div class="registry-columns accounts-columns">
                    <span>EMAIL</span>
                    <span>ROLE</span>
                    <span>PROFILE</span>
                    <span>ACTIONS</span>
                </div>

                <ul id="account-list" class="card-list"></ul>

                <div id="empty-state" class="empty-state" style="display:none">
                    <span class="empty-icon">◌</span>
                    <span>No accounts yet.</span>
                </div>

            </main>

        </div>

    </div>

    <script type="module" src="/static/register.js"></script>
</body>
</html>
